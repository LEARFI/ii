<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .tg-input { background: var(--secondary-bg); border: none; }
        .tg-button { background: var(--button-color); color: var(--tg-theme-button-text-color, #ffffff); }
        .tab-active { border-bottom: 2px solid var(--button-color); color: var(--button-color); }
        button { touch-action: manipulation; }
        .chat-bubble { max-width: 85%; }
        #preview-frame { background: white; }
    </style>
</head>
<body class="flex flex-col h-[100dvh] overflow-hidden">

    <header class="p-4 border-b flex justify-between items-center bg-[var(--bg-color)] shrink-0">
        <div class="flex gap-6">
            <button onclick="switchTab('chat')" id="tab-chat" class="tab-active py-2 font-medium">Чат</button>
            <button onclick="switchTab('preview')" id="tab-preview" class="py-2 font-medium opacity-60">Предпросмотр</button>
        </div>
        <div id="status" class="text-[10px] uppercase tracking-wider opacity-50">Настройки</div>
    </header>

    <div id="settings-panel" class="p-4 bg-[var(--secondary-bg)] border-b text-sm">
        <div class="flex gap-2 items-center">
            <input type="password" id="api-key" placeholder="Gemini API Key" 
                   class="flex-1 p-2 rounded tg-input" onchange="saveApiKey()">
            <a href="https://aistudio.google.com/app/apikey" target="_blank" 
               class="px-3 py-2 bg-white rounded shadow-sm text-xs font-medium">Получить ключ</a>
        </div>
        <p class="text-[10px] opacity-50 mt-2">Ключ сохраняется только на вашем устройстве.</p>
    </div>

    <main id="chat-view" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div id="messages" class="flex flex-col gap-3">
            <div class="p-4 bg-[var(--secondary-bg)] rounded-2xl text-sm self-start chat-bubble">Привет! Я готов писать код. Если еще нет ключа, нажмите кнопку "Получить ключ" выше.</div>
        </div>
    </main>

    <div id="preview-view" class="hidden flex-1 flex flex-col overflow-hidden bg-gray-100">
        <div class="flex-1 w-full bg-white">
            <iframe id="preview-frame" class="w-full h-full border-0"></iframe>
        </div>
        <div class="p-3 bg-[var(--bg-color)] border-t">
            <button onclick="copyCode()" class="w-full py-3 rounded-xl bg-[var(--secondary-bg)] text-sm font-semibold">Скопировать код</button>
        </div>
    </div>

    <footer class="p-3 border-t bg-[var(--bg-color)] shrink-0">
        <div class="flex gap-2 items-center">
            <textarea id="prompt" class="flex-1 p-3 rounded-2xl tg-input text-sm resize-none h-[44px] focus:outline-none" placeholder="Напиши код..."></textarea>
            <button onclick="generateCode()" class="w-[44px] h-[44px] flex items-center justify-center rounded-2xl tg-button text-xl font-bold">→</button>
        </div>
    </footer>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        let currentCode = "";
        let chatHistory = [
            { role: "user", parts: [{ text: "Ты — профи фронтенд-разработчик. Отвечай только готовым HTML-кодом с Tailwind." }] },
            { role: "model", parts: [{ text: "Понял. Какой код написать?" }] }
        ];

        document.getElementById('api-key').value = localStorage.getItem('gemini_api_key') || '';

        function saveApiKey() {
            localStorage.setItem('gemini_api_key', document.getElementById('api-key').value);
        }

        function switchTab(tab) {
            const isChat = tab === 'chat';
            document.getElementById('chat-view').classList.toggle('hidden', !isChat);
            document.getElementById('preview-view').classList.toggle('hidden', isChat);
            document.getElementById('tab-chat').classList.toggle('tab-active', isChat);
            document.getElementById('tab-preview').classList.toggle('tab-active', !isChat);
        }

        async function generateCode() {
            const promptInput = document.getElementById('prompt');
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                alert("Пожалуйста, сначала введите Gemini API Key.");
                return;
            }

            const prompt = promptInput.value;
            if (!prompt) return;

            const messages = document.getElementById('messages');
            messages.innerHTML += `<div class="p-4 rounded-2xl text-sm self-end bg-[var(--button-color)] text-white">${prompt}</div>`;
            promptInput.value = "";
            messages.scrollTop = messages.scrollHeight;

            chatHistory.push({ role: "user", parts: [{ text: prompt }] });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: chatHistory })
                });

                const data = await response.json();
                const code = data.candidates[0].content.parts[0].text.replace(/```html/g, '').replace(/```/g, '');
                
                chatHistory.push({ role: "model", parts: [{ text: code }] });
                currentCode = code;
                document.getElementById('preview-frame').srcdoc = code;
                
                messages.innerHTML += `<div class="p-4 bg-[var(--secondary-bg)] rounded-2xl text-sm self-start">Готово! Перейдите на вкладку "Предпросмотр".</div>`;
                messages.scrollTop = messages.scrollHeight;
            } catch (err) {
                alert("Ошибка генерации: " + err.message);
            }
        }
