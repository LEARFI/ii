<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --button-color: var(--tg-theme-button-color, #2481cc);
        }
        body { background-color: var(--bg-color); color: var(--text-color); }
        .tg-input { background: var(--tg-theme-secondary-bg-color, #f0f0f0); }
        .tg-button { background: var(--button-color); color: var(--tg-theme-button-text-color, #ffffff); }
        .tab-active { border-bottom: 2px solid var(--button-color); }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <header class="p-4 border-b flex justify-between items-center">
        <div class="flex gap-4">
            <button onclick="switchTab('chat')" id="tab-chat" class="tab-active py-2">Чат</button>
            <button onclick="switchTab('preview')" id="tab-preview" class="py-2">Предпросмотр</button>
        </div>
        <div id="status" class="text-xs opacity-50">Готов</div>
    </header>

    <main id="chat-view" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div id="messages" class="flex flex-col gap-2">
            <div class="p-3 bg-gray-100 rounded-lg text-sm self-start max-w-[80%]">Привет! Я твой ИИ-ассистент. Какой код мне написать?</div>
        </div>
    </main>

    <div id="preview-view" class="hidden flex-1 flex flex-col">
        <div class="flex-1 p-2 bg-white">
            <iframe id="preview-frame" class="w-full h-full border-0"></iframe>
        </div>
        <div class="p-2 border-t flex gap-2">
            <button onclick="copyCode()" class="flex-1 py-2 rounded-lg bg-gray-200 text-sm font-bold">Копировать код</button>
        </div>
    </div>

    <footer class="p-4 border-t">
        <div class="flex gap-2">
            <textarea id="prompt" class="flex-1 p-3 rounded-lg tg-input text-sm resize-none h-12" placeholder="Напиши код..."></textarea>
            <button onclick="generateCode()" class="px-6 rounded-lg tg-button font-bold">></button>
        </div>
    </footer>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let currentCode = "";
        let chatHistory = [
            { role: "user", parts: [{ text: "Ты — профессиональный эксперт по фронтенд-разработке. Помогай писать HTML/Tailwind код. Всегда возвращай только готовый HTML код." }] },
            { role: "model", parts: [{ text: "Привет! Я готов помочь тебе с написанием кода." }] }
        ];

        function switchTab(tab) {
            document.getElementById('chat-view').classList.toggle('hidden', tab !== 'chat');
            document.getElementById('preview-view').classList.toggle('hidden', tab !== 'preview');
            document.getElementById('tab-chat').classList.toggle('tab-active', tab === 'chat');
            document.getElementById('tab-preview').classList.toggle('tab-active', tab === 'preview');
        }

        async function generateCode() {
            const promptInput = document.getElementById('prompt');
            const prompt = promptInput.value;
            if (!prompt) return;

            const messages = document.getElementById('messages');
            const status = document.getElementById('status');
            
            status.innerText = "Генерация...";
            messages.innerHTML += `<div class="p-3 bg-blue-100 rounded-lg text-sm self-end max-w-[80%]">${prompt}</div>`;
            promptInput.value = "";

            chatHistory.push({ role: "user", parts: [{ text: prompt }] });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: chatHistory })
                });

                const data = await response.json();
                let code = data.candidates[0].content.parts[0].text;
                code = code.replace(/```html/g, '').replace(/```/g, '');
                
                chatHistory.push({ role: "model", parts: [{ text: code }] });
                currentCode = code;
                document.getElementById('preview-frame').srcdoc = code;
                
                status.innerText = "Готово";
                messages.innerHTML += `<div class="p-3 bg-gray-100 rounded-lg text-sm self-start max-w-[80%]">Код сгенерирован! Перейди во вкладку "Предпросмотр".</div>`;
            } catch (err) {
                status.innerText = "Ошибка";
                console.error(err);
            }
        }

        function copyCode() {
            const textarea = document.createElement('textarea');
            textarea.value = currentCode;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "Скопировано!";
            setTimeout(() => btn.innerText = originalText, 2000);
        }
    </script>
</body>
</html>
