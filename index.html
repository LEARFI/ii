
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .tg-input { background: var(--secondary-bg); }
        .tg-button { background: var(--button-color); color: var(--tg-theme-button-text-color, #ffffff); }
        .tab-active { border-bottom: 2px solid var(--button-color); color: var(--button-color); }
        /* Мобильные оптимизации */
        button { touch-action: manipulation; }
        .chat-bubble { max-width: 90%; }
        #preview-frame { background: white; }
    </style>
</head>
<body class="flex flex-col h-[100dvh] overflow-hidden">

    <header class="p-4 border-b flex justify-between items-center bg-[var(--bg-color)] shrink-0">
        <div class="flex gap-6">
            <button onclick="switchTab('chat')" id="tab-chat" class="tab-active py-2 font-medium">Чат</button>
            <button onclick="switchTab('preview')" id="tab-preview" class="py-2 font-medium opacity-60">Предпросмотр</button>
        </div>
        <div id="status" class="text-[10px] uppercase tracking-wider opacity-50">Готов</div>
    </header>

    <main id="chat-view" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div id="messages" class="flex flex-col gap-3">
            <div class="p-4 bg-[var(--secondary-bg)] rounded-2xl text-sm self-start chat-bubble">Привет! Я твой ИИ-ассистент. Опиши веб-сайт, который хочешь создать.</div>
        </div>
    </main>

    <div id="preview-view" class="hidden flex-1 flex flex-col overflow-hidden bg-gray-100">
        <div class="flex-1 w-full bg-white">
            <iframe id="preview-frame" class="w-full h-full border-0"></iframe>
        </div>
        <div class="p-3 bg-[var(--bg-color)] border-t">
            <button onclick="copyCode()" class="w-full py-3 rounded-xl bg-[var(--secondary-bg)] text-sm font-semibold">Скопировать код</button>
        </div>
    </div>

    <footer class="p-3 border-t bg-[var(--bg-color)] shrink-0">
        <div class="flex gap-2 items-center">
            <textarea id="prompt" class="flex-1 p-3 rounded-2xl tg-input text-sm resize-none h-[44px] focus:outline-none" placeholder="Напиши код сайта..."></textarea>
            <button onclick="generateCode()" class="w-[44px] h-[44px] flex items-center justify-center rounded-2xl tg-button text-xl font-bold">→</button>
        </div>
    </footer>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let currentCode = "";
        let chatHistory = [
            { role: "user", parts: [{ text: "Ты — профессиональный эксперт по фронтенд-разработке. Помогай писать HTML/Tailwind код. Всегда возвращай только готовый HTML код без пояснений." }] },
            { role: "model", parts: [{ text: "Привет! Я готов помочь. Опиши задачу." }] }
        ];

        function switchTab(tab) {
            const isChat = tab === 'chat';
            document.getElementById('chat-view').classList.toggle('hidden', !isChat);
            document.getElementById('preview-view').classList.toggle('hidden', isChat);
            document.getElementById('tab-chat').classList.toggle('tab-active', isChat);
            document.getElementById('tab-chat').classList.toggle('opacity-60', !isChat);
            document.getElementById('tab-preview').classList.toggle('tab-active', !isChat);
            document.getElementById('tab-preview').classList.toggle('opacity-60', isChat);
        }

        async function generateCode() {
            const promptInput = document.getElementById('prompt');
            const prompt = promptInput.value;
            if (!prompt) return;

            const messages = document.getElementById('messages');
            const status = document.getElementById('status');
            
            status.innerText = "Генерация...";
            messages.innerHTML += `<div class="p-4 rounded-2xl text-sm self-end max-w-[90%] bg-[var(--button-color)] text-white">${prompt}</div>`;
            promptInput.value = "";
            messages.scrollTop = messages.scrollHeight;

            chatHistory.push({ role: "user", parts: [{ text: prompt }] });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: chatHistory })
                });

                const data = await response.json();
                let code = data.candidates[0].content.parts[0].text;
                code = code.replace(/```html/g, '').replace(/```/g, '');
                
                chatHistory.push({ role: "model", parts: [{ text: code }] });
                currentCode = code;
                document.getElementById('preview-frame').srcdoc = code;
                
                status.innerText = "Готово";
                messages.innerHTML += `<div class="p-4 bg-[var(--secondary-bg)] rounded-2xl text-sm self-start chat-bubble">Код готов! Перейди во вкладку «Предпросмотр».</div>`;
                messages.scrollTop = messages.scrollHeight;
            } catch (err) {
                status.innerText = "Ошибка";
                console.error(err);
            }
        }

        function copyCode() {
            navigator.clipboard.writeText(currentCode).then(() => {
                const btn = event.target;
                const originalText = btn.innerText;
                btn.innerText = "Скопировано!";
                setTimeout(() => btn.innerText = originalText, 2000);
            });
        }
    </script>
</body>
</html>>
